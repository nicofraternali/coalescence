# This file is a complete, structurally valid killer sudoku puzzle in YAML
# form. It demonstrates the input format for the solver. The cage layout
# is real (every cell covered, sums total 405) but the puzzle is not
# guaranteed to be solvable — this is purely a formatting reference.
#
# Conventions:
#   - Cells are [row, col], zero-indexed.
#   - Cage IDs are arbitrary but conventionally numbered in reading order.
#   - The first cell of each cage's list is conventionally the top-left
#     cell of the cage (the one displaying the sum in the app).
#
# Structural invariants (the validator enforces these):
#   - Every cell in the 9x9 belongs to exactly one cage.
#   - Cage sums total 405 (= 9 rows * 45).
#   - Every cage has at least one valid digit combination.

